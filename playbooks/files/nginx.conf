server {
    listen 80 default_server;
    listen [::]:80 default_server; # 💡「ipv6only=on」を削除しました

    root /usr/share/nginx/html;    # 💡Playbook側の「dest」と合わせる必要があります
    index index.html index.htm;

    server_name localhost;

    location / {
        try_files $uri $uri/ =404; # 💡末尾にセミコロン「;」を追加しました
    }
}
