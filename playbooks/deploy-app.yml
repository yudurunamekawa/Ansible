---
- name: Deploy Mezzanine / Django Full Stack Environment
  hosts: webservers
  become: true
  vars:
    proj_name: "mezzanine_proj"
    db_pass: "secure_db_password_123"
    secret_key: "super_secret_django_key_xyz"
    nevercache_key: "never_cache_key_abc"

  tasks:
    # ---------------------------------------------------
    # 1. 必要なシステムパッケージの一括インストール
    # ---------------------------------------------------
    - name: Install required system packages
      apt:
        name:
          - python3-pip
          - python3-venv
          - libpq-dev       # PostgreSQLのPythonドライバ(psycopg2)のビルドに必要
          - postgresql
          - postgresql-contrib
          - memcached
        update_cache: yes
        state: present

    # ---------------------------------------------------
    # 2. ミドルウェアサービス（DB, キャッシュ）の起動確認
    # ---------------------------------------------------
    - name: Ensure PostgreSQL and Memcached are running
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - postgresql
        - memcached

    # ---------------------------------------------------
    # 3. PostgreSQL データベースとユーザーの自動作成
    # ---------------------------------------------------
    # PostgreSQLの中に、Django用のDBとユーザーを安全に作成します
    - name: Create PostgreSQL user
      become_user: postgres
      postgresql_user:
        name: "{{ proj_name }}"
        password: "{{ db_pass }}"
        priv: "ALL"
        role_attr_flags: "SUPERUSER"

    - name: Create PostgreSQL database
      become_user: postgres
      postgresql_db:
        name: "{{ proj_name }}"
        owner: "{{ proj_name }}"

    # ---------------------------------------------------
    # 4. アプリケーション配置先フォルダの作成と設定配信
    # ---------------------------------------------------
    - name: Ensure project directory exists
      file:
        path: "/var/www/{{ proj_name }}"
        state: directory
        owner: vagrant
        group: vagrant
        mode: '0755'

    - name: Deploy local_settings.py from template
      template:
        src: templates/local_settings.py.j2
        dest: "/var/www/{{ proj_name }}/local_settings.py"
        owner: vagrant
        group: vagrant
        mode: '0644'
