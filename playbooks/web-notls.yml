- name: Configure webserver with nginx
  hosts: testserver           # 先ほど疎通に成功した「testserver」に変更しています
  become: true
  tasks:
    - name: Install nginx
      apt:
        name: nginx
        update_cache: yes
        state: present        # state（状態）を明示するのが推奨されています

    - name: Copy nginx config file
      copy:
        src: files/nginx.conf
        dest: /etc/nginx/sites-available/default
      notify: Restart nginx   # 設定変更があった時だけ再起動を呼び出す（後述）

    - name: Enable configuration
      file:
        src: /etc/nginx/sites-available/default
        dest: /etc/nginx/sites-enabled/default
        state: link

    - name: Copy index.html
      template:
        src: templates/index.html.j2
        dest: /usr/share/nginx/html/index.html 
        mode: '0644'                  # 構文エラー防止のためクォーテーションで囲みます

  # 変更があった時だけ1度だけ実行される仕組み（ハンドラー）
  handlers:
    - name: Restart nginx
      service:
        name: nginx
        state: restarted
